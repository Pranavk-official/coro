# /etc/nginx/sites-available/coro  (then: ln -s ../sites-available/coro /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx)
# Certificates: certbot --nginx -d meet.example.com
# The app must listen on the host: add `ports: ["127.0.0.1:3000:3000"]` to the app service.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name meet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name meet.example.com;

    ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Socket.IO (signaling) upgrades to WebSocket: keep these two lines.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h; # long-lived call connections
    }
}
